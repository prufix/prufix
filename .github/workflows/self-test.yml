# Self-test for the prufix action.
#
# Paths are relative to the published repository root (= app/ in the
# development monorepo). Two layers:
#   unit   - the wrapper logic against stub engine/formatter, no Docker
#   docker - the real image, built from ./Dockerfile by `uses: ./`
name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Wrapper unit tests (stub engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the local test suite
        run: bash action/test/run-tests.sh

  docker:
    name: End-to-end against the real image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bundled fixtures
        id: fixtures
        uses: ./
        with:
          path: 'test/fixtures/**/*.xml'
          profile: 'auto'
          fail-on: 'never'
          comment: false

      - name: Assert fixtures were checked
        run: |
          echo "files-checked=${{ steps.fixtures.outputs.files-checked }} errors=${{ steps.fixtures.outputs.errors }} warnings=${{ steps.fixtures.outputs.warnings }}"
          test "${{ steps.fixtures.outputs.files-checked }}" -ge 1

      # A deliberately unparseable file must surface as an error finding
      # (engine exit 2 -> INPUT-INVALID) and fail the step under
      # fail-on: error. This guards the worst failure mode: a broken
      # container reporting green.
      - name: Create a deliberately broken input
        run: |
          mkdir -p self-test
          printf 'this is not xml' > self-test/broken.xml

      - name: Broken input must fail the step
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: 'self-test/broken.xml'
          profile: 'en16931'
          fail-on: 'error'
          comment: false

      - name: Assert the failure was reported
        run: |
          test "${{ steps.broken.outcome }}" = "failure"
          test "${{ steps.broken.outputs.errors }}" -ge 1
          test "${{ steps.broken.outputs.passed }}" = "false"

      - name: Zero glob matches must fail with a clear message
        id: nomatch
        continue-on-error: true
        uses: ./
        with:
          path: 'no/such/dir/**/*.xml'
          profile: 'auto'
          fail-on: 'never'
          comment: false

      - name: Assert the zero-match failure
        run: test "${{ steps.nomatch.outcome }}" = "failure"

  # The PR-comment path (action/src/github.js) has no coverage outside the
  # fake-GitHub unit tests: a `push` run never reaches it, because
  # prContext() returns null for anything but pull_request. This job is the
  # only place the real API call happens, so it also asserts the result --
  # running the action without checking what it wrote is what let the
  # facturx profile ship broken.
  #
  # Skipped for fork PRs: GITHUB_TOKEN is read-only there by design, the
  # action degrades to a warning, and the assertion below would fail on a
  # contributor's PR for a reason that is not their fault.
  pr-comment:
    name: PR comment path
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate fixtures and post the PR comment
        uses: ./
        with:
          path: 'test/fixtures/**/*.xml'
          profile: 'auto'
          fail-on: 'never'
          comment: true

      # Exactly one, not at least one: the marker exists so that a re-run
      # updates the comment in place. Two markers means the upsert became an
      # append, which is invisible on a first run and only shows up here.
      - name: Assert exactly one marked comment exists
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[].body' | grep -c '<!-- prufix:report -->' || true)
          echo "comments carrying the marker: ${count}"
          test "${count}" -eq 1
